
name: Issue Translator

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

# Grant only the permissions needed by this workflow.
permissions:
  issues: write

jobs:
  translate:
    name: Translate issue content
    runs-on: ubuntu-latest

    steps:
      - name: Translate non-English issues
        uses: usthe/issues-translate-action@v2.7
        with:
          IS_MODIFY_TITLE: false
          CUSTOM_BOT_NOTE: "Bot detected a non-English issue and will translate it automatically."

